name: FreeAI Credo & Sovereign Gatekeeper Sentinel

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - dev

jobs:
  credo_audit:
    name: Credo & Security Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      ACTIONS_RUNNER_FORCE_NODE24: "true"
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: 📥 Récupération du Codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Initialisation de Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des Dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 🛡️ Audit du Credo Souverain par FreeAI
        id: credo_check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          HEAD_REF="${{ github.event.pull_request.head.sha || 'HEAD' }}"
          PR_NUM="${{ github.event.pull_request.number || 0 }}"
          AUTHOR="${{ github.event.pull_request.user.login || github.actor }}"
          
          python -m app.security.credo_sentinel \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --pr "$PR_NUM" \
            --author "$AUTHOR" \
            --notify > credo_report.md
            
          cat credo_report.md

      - name: 💬 Publication du Verdict sur la PR GitHub
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = "### 🛡️ Rapport d'Audit FreeAI Sentinelle";
            if (fs.existsSync('credo_report.md')) {
              body = fs.readFileSync('credo_report.md', 'utf8');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: 🧪 Banc de Tests et Anti-Régression
        run: |
          PYTHONPATH=. pytest -q --maxfail=1
