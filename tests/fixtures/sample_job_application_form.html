<!DOCTYPE html>
<html>
<head><title>Test Application Form</title></head>
<body>
  <h1>Apply for Senior Backend Engineer</h1>
  <form>
    <label for="f">First Name</label><input id="f" name="first_name">
    <label for="l">Last Name</label><input id="l" name="last_name">
    <label for="em">Email</label><input id="em" name="email" type="email">
    <label for="ph">Phone</label><input id="ph" name="phone" type="tel">
    <label for="ct">City</label><input id="ct" name="city">
    <label for="cl">Cover Letter</label>
    <textarea id="cl" name="cover_letter" rows="6" cols="40"></textarea>
    <label for="cv">Upload Resume (CV)</label>
    <input id="cv" name="resume" type="file">
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
